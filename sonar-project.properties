# SonarCloud configuration.
#
# Kept as a file rather than as arguments on the scan step, so the analysis says
# the same thing whichever machine runs it and so that what gets analysed is
# visible to anyone reading the repository rather than buried in a workflow.
#
# The token is never in here. It comes from the SONAR_TOKEN repository secret.

# These two have to match, or the scan is refused with "not authorized or project
# not found" — which reads like a token problem and is not one. Neither is
# derivable from the directory name, which is why both are written out.
sonar.projectKey=markdown-office_commonmark-generic-directives
sonar.organization=markdown-office

# The library is what is analysed; the tests are read so that duplication and
# complexity are judged against them.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Everything a build produces rather than anything authored. `tools` holds the
# PHPStan phar the analysis job downloads, which is a binary and not source.
sonar.exclusions=\
  build/**,\
  vendor/**,\
  tools/**,\
  .phpunit.cache/**

# The version the code has to *run* on, which is not the version CI happens to
# run on. It is what the analysis is judged against, so setting it higher would
# let syntax in that the minimum-version job then rejects.
sonar.php.version=8.2

# Both reports are written by the analysis job, which runs the suite once for
# coverage and for the test results together.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.junit.reportPaths=build/coverage/junit.xml

# Coverage is a statement about the library, so it is measured over the library.
#
# The tests are still analysed — they are where duplication would show up first
# — but they are kept out of the coverage figure. A pull request that adds tests
# would otherwise dilute its own coverage with lines that no coverage report
# describes, which is a gate that punishes writing tests. The gate here is at the
# ceiling, so there is no slack for that dilution to hide in.
sonar.coverage.exclusions=tests/**

# `composer update` in CI is reported as an unpinned dependency tree. It is a library,
# `/composer.lock` is in `.gitignore` on purpose, and there is a reason for both: the
# thing a lock would make repeatable here is a test run, and what that run is for is
# finding out whether this package still works against the newest versions its
# constraints allow. A committed lock would replace that with a green tick against
# whatever happened to be newest when the lock was written.
#
# Suppressed for the workflow file only, and for this one rule, so that a `composer
# install` without a lock added somewhere else is still reported — that one would be a
# different mistake with the same wording.
#
# If this ever stops being the right trade, the change is to commit the lock, switch
# every `composer update` to `composer install`, and add the scheduled `dependencies`
# job markdown-word already runs so that new releases are still tested. That resolves
# the rule instead of silencing it.
sonar.issue.ignore.multicriteria=unlocked-library-deps
sonar.issue.ignore.multicriteria.unlocked-library-deps.ruleKey=githubactions:S8546
sonar.issue.ignore.multicriteria.unlocked-library-deps.resourceKey=.github/workflows/*.yml